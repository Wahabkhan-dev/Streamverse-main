# Local development services. Not a production deployment file.
# Usage: docker compose up -d
# MySQL credentials are read from environment variables — copy .env.example to .env and set them.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-streamverse_dev}
      MYSQL_USER: ${MYSQL_USER:-streamverse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-streamverse}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-dev-root-password}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-streamverse}:${MYSQL_PASSWORD:-streamverse}@db:3306/${MYSQL_DATABASE:-streamverse_dev}
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: dev-only-jwt-secret-not-for-production-use-0001
      JWT_REFRESH_SECRET: dev-only-jwt-refresh-secret-not-for-production-0002
      STRIPE_SECRET_KEY: sk_test_changeme
      STRIPE_WEBHOOK_SECRET: whsec_changeme
      STRIPE_SUCCESS_URL: http://localhost:5173/billing/success
      STRIPE_CANCEL_URL: http://localhost:5173/billing/cancel
      QUEUE_DRIVER: bullmq
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist

volumes:
  mysqldata:
